name: Deploy
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: docker build -t block-analyzer .

      - name: Package
        run: docker save block-analyzer | gzip > /tmp/block-analyzer.tar.gz

      - name: Send to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          scp /tmp/block-analyzer.tar.gz root@${{ secrets.SERVER_IP }}:/data/

      - name: Deploy
        run: |
          ssh root@${{ secrets.SERVER_IP }} '
            set -e
            cd /data
            gunzip -c block-analyzer.tar.gz | docker load
            docker stop block-analyzer 2>/dev/null || true
            docker rm block-analyzer 2>/dev/null || true
            docker run -d \
              --name block-analyzer \
              --restart unless-stopped \
              -p 3030:3030 \
              -v /data/block-analyzer-data:/app/apps/api/data \
              -e LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
              -e LLM_MODEL=${{ secrets.LLM_MODEL }} \
              -e LLM_BASE_URL=${{ secrets.LLM_BASE_URL }} \
              -e ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }} \
              -e SOLSCAN_API_KEY=${{ secrets.SOLSCAN_API_KEY }} \
              -e PORT=3030 \
              -e FRONTEND_ORIGIN=${{ secrets.FRONTEND_ORIGIN }} \
              block-analyzer:latest
            rm -f block-analyzer.tar.gz
          '

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Cloudflare Worker
        run: |
          npm install -g wrangler
          cd apps/worker
          wrangler deploy \
            --name block-analyzer-proxy \
            --compatibility-date 2024-12-01 \
            --var ORIGIN_SERVER:${{ secrets.ORIGIN_SERVER }} \
            --routes ${{ secrets.WORKER_ROUTE || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  worker:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        run: |
          npm install -g wrangler
          cd apps/worker
          wrangler deploy \
            --name block-analyzer-proxy \
            --compatibility-date 2024-12-01 \
            --var ORIGIN_SERVER:${{ secrets.ORIGIN_SERVER }} \
            --routes ${{ secrets.WORKER_ROUTE || '' }} \
            --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
